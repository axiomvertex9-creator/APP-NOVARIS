<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orion Flight Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pn:#eef4ffe6;--ink:#0b2342;--mu:#4b6685;--ln:#9db8d8;--ac:#0a64e8;--ok:#0f9d58;--bad:#d32f3c;--wr:#c77700;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pn:#08122bdd;--ink:#e8f1ff;--mu:#93aacb;--ln:#2b4a7a;--ac:#4db2ff;--ok:#38d98a;--bad:#ff6470;--wr:#ffb347}}
:root[data-theme="dark"]{--pn:#08122bdd;--ink:#e8f1ff;--mu:#93aacb;--ln:#2b4a7a;--ac:#4db2ff;--ok:#38d98a;--bad:#ff6470;--wr:#ffb347}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:var(--ink);font:500 13px/1.4 'Chakra Petch',system-ui,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--pn);border:2px solid var(--ln);border-radius:9px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid var(--wr);outline-offset:2px}
.tg:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#667;margin-right:7px}.tg.on:before{background:var(--ok);box-shadow:0 0 8px var(--ok)}.tg.bd:before{background:var(--bad)}
#tel{position:fixed;left:8px;top:8px;width:min(48vw,250px);padding:8px 10px;border-radius:12px;background:var(--pn);border:1px solid var(--ln);font:600 11px/1.55 ui-monospace,Menlo,monospace}
#tel div{display:flex;justify-content:space-between;gap:8px}#tel span{color:var(--mu)}#tel h4{margin:0 0 3px;font:700 10px 'Chakra Petch';letter-spacing:.1em;color:var(--ac)}
#top{position:fixed;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
#al{position:fixed;left:50%;top:52px;transform:translateX(-50%);padding:7px 16px;border-radius:10px;background:var(--bad);color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:90vw}#al.on{opacity:1}#al.i{background:var(--ac)}
#cab{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,780px);background:var(--pn);border:2px solid var(--ln);border-bottom:0;border-radius:16px 16px 0 0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.st{display:none;gap:14px;align-items:center;justify-content:space-around;flex-wrap:wrap;min-height:116px}.st.on{display:flex;animation:sl .3s}@keyframes sl{from{opacity:0;transform:translateX(34px)}}
.st small{display:block;text-align:center;color:var(--mu);font-size:10px;letter-spacing:.1em}
#cab nav{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
#joy{width:100px;height:100px;border-radius:50%;background:radial-gradient(#d3dcea,#7f93b0);border:3px solid var(--ln);position:relative;touch-action:none;cursor:grab}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:radial-gradient(#f55,#900);box-shadow:0 4px 8px #0006;pointer-events:none}
#thr{writing-mode:vertical-lr;direction:rtl;height:98px;width:34px;accent-color:var(--ac)}
.guard{position:relative;width:96px;height:72px}.guard button{position:absolute;left:0;right:0;bottom:0}
.cv{position:absolute;left:0;right:0;top:0;height:66px;z-index:2;background:repeating-linear-gradient(45deg,#d9a300,#d9a300 8px,#222 8px,#222 16px);border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;text-shadow:0 0 4px #000;cursor:pointer;transition:transform .35s,opacity .35s;transform-origin:top}
.cv.o{transform:translateY(-64px) rotateX(70deg);opacity:.55}
.mt{height:8px;border-radius:5px;background:var(--ln);overflow:hidden;margin:2px 0 6px;width:120px}.mt i{display:block;height:100%;width:0;background:var(--ok)}
#sbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:96vw}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 14px;overflow:auto;background:radial-gradient(ellipse at 70% 0%,#17356a,#02030a 60%);color:#e8f1ff}
#menu h1{margin:0;letter-spacing:.2em;font-size:clamp(22px,5vw,38px);text-align:center}#menu p{margin:0;color:#9cb0ca;text-align:center;max-width:640px}
#menu .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#menu button{color:#e8f1ff;background:#0c1d3d;border-color:#2b4a7a}#menu button.on{background:#0a64e8;border-color:#4db2ff}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));width:min(100%,1000px)}.card{background:#0a1630;border:2px solid #2b4a7a;border-radius:14px;padding:14px}.card h3{margin:0 0 4px}.card p{text-align:left;font-size:12px;margin:3px 0 8px}
#toast{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);max-width:90vw;padding:9px 15px;border-radius:12px;background:#0b2342ee;color:#e8f1ff;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;z-index:9}#toast.on{opacity:1}
.md{position:fixed;inset:0;display:none;place-items:center;background:#000a;z-index:20}.md.on{display:grid}.mb{background:#0a1630;color:#e8f1ff;border:2px solid #4db2ff;border-radius:16px;padding:22px;max-width:min(92vw,440px);text-align:center}.mb button{margin:4px;color:#e8f1ff;background:#0a64e8;border-color:#4db2ff}
@media(max-width:600px){#tel{font-size:10px;width:44vw}.st{gap:8px}}
@media(prefers-reduced-motion:reduce){.st.on{animation:none}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="tel"></div><div id="top"></div><div id="al" role="alert"></div>
<div id="cab">
 <div class="st on" id="st0">
  <div><div id="joy" aria-label="Steering joystick"><i id="knob"></i></div><small>STEER</small></div>
  <div style="text-align:center"><input id="thr" type="range" min="0" max="100" value="0" aria-label="Throttle lever"><small>THROTTLE</small></div>
  <div><div class="guard"><div class="cv" id="wcv" role="button" tabindex="0">⚠ WARP GUARD</div><button class="tg" id="wsw">WARP</button></div><small>LIFT COVER</small></div>
  <div style="display:grid;gap:6px"><button class="tg" id="apb">AUTOPILOT</button><button id="vwb">VIEW: COCKPIT</button></div>
 </div>
 <div class="st" id="st1">
  <div><small>HULL</small><div class="mt"><i id="mh"></i></div><small>HULL TEMP</small><div class="mt"><i id="mt"></i></div><small>WARP CORE</small><div class="mt"><i id="mc"></i></div><small>FUEL</small><div class="mt"><i id="mf"></i></div></div>
  <div style="display:grid;gap:6px"><button class="tg" id="clb">RADIATORS</button><button class="tg" id="shb">SHIELDS</button></div>
  <div style="display:grid;gap:6px"><button id="vtb">VENT WARP CORE</button><button id="rpb">REPAIR DRONES (3)</button></div>
 </div>
 <div class="st" id="st2">
  <div style="display:grid;gap:6px"><button id="evb">🧑‍🚀 SPACEWALK</button><button id="lnb">🛬 LAND / DESCEND</button></div>
  <div id="amsg" style="max-width:300px;color:var(--mu)">Airlock ready. Stop the ship to go out. Rocky worlds can be landed on and walked.</div>
 </div>
 <nav><button id="wl">◀ WALK</button><b id="stn">PILOT SEAT</b><button id="wr">WALK ▶</button></nav>
</div>
<div id="sbar"></div><div id="toast"></div><div class="md" id="md"></div>
<div id="menu"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),PI=Math.PI,rnd=Math.random;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k],len=a=>Math.hypot(a[0],a[1],a[2]);
const VMAX=.035,WARP=6,CK=299792,DR=PI/180,dir=(az,el)=>[Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az)];
const fd=km=>km<1e4?Math.round(km).toLocaleString('en-US')+' km':km<1e9?(km/1e6).toFixed(1)+' M km':km<9.461e11?(km/1.496e8).toFixed(1)+' AU':(km/9.461e12>=1e4?(km/9.461e12/1e3).toFixed(1)+' k ly':(km/9.461e12).toFixed(2)+' ly');
const VKM=25.902e9-(Date.UTC(2026,10,18,10,16,7)-Date.now())/1e3*17;   // NASA: 1 light-day on 18 Nov 2026, ~17 km/s
const BO=o=>{o.p=o.dd?dir(o.az*DR,o.el*DR).map(v=>v*o.dd):o.p;return o};
const BODIES=[
BO({id:'earth',n:'EARTH',k:'rock',c:'#4d9de0',r:.06,p:[0,-.13,.1],km:0,Rk:6371,land:1,cat:'S',g:'9.8 m/s²',t:'15 °C',air:'N₂ / O₂, 1 bar',atm:1,sky:['#2d74d6','#cfe8ff'],gnd:'#4d7a3a',ridge:'#5d7fa0',sun:.014,ll:[28.6,-80.6],info:'Home. Zero travel time.'}),
BO({id:'moon',n:'MOON',k:'rock',c:'#b9b7bd',r:.025,dd:.5,az:20,el:8,km:384400,Rk:1737,land:1,cat:'S',g:'1.62 m/s²',t:'−23 °C avg',air:'None (vacuum)',sky:['#000','#050507'],gnd:'#8a8890',ridge:'#6b6970',sun:.012,stars:1,ll:[.67,23.47],info:'Tranquility, low gravity.'}),
BO({id:'mercury',n:'MERCURY',k:'rock',c:'#b1a99f',r:.03,dd:2.45,az:60,el:-5,km:9.2e7,Rk:2440,land:1,cat:'S',g:'3.7 m/s²',t:'167 °C avg',air:'None (vacuum)',sky:['#000','#07070b'],gnd:'#7a746e',ridge:'#5d5853',sun:.03,stars:1,ll:[0,0],info:'Scorched day side, frozen night.'}),
BO({id:'venus',n:'VENUS',k:'rock',c:'#e8c07a',r:.06,dd:1.75,az:-50,el:4,km:4.14e7,Rk:6052,land:0,atm:1,cat:'S',info:'464 °C, crushing air. Spacewalk only.'}),
BO({id:'mars',n:'MARS',k:'rock',c:'#d1553a',r:.045,dd:2.8,az:130,el:2,km:7.8e7,Rk:3389,land:1,atm:1,cat:'S',g:'3.7 m/s²',t:'−65 °C avg',air:'CO₂, very thin',sky:['#b9805a','#f0cba6'],gnd:'#a4512d',ridge:'#85452a',sun:.009,ll:[18.4,77.4],info:'Rust-red plains and rovers.'}),
BO({id:'jupiter',n:'JUPITER',k:'gas',c:'#d9a877',r:.35,dd:4.2,az:-110,el:-3,km:6.29e8,Rk:69911,atm:1,cat:'S',bands:['#d9a877','#b9714a','#efd3a8','#a65f3a'],info:'Gas giant. Spacewalk only.'}),
BO({id:'saturn',n:'SATURN',k:'gas',c:'#e6d0a0',r:.3,dd:6.3,az:170,el:6,km:1.28e9,Rk:58232,atm:1,cat:'S',ring:1,bands:['#e6d0a0','#cdb78a','#f0e2bb'],info:'The ringed giant.'}),
BO({id:'uranus',n:'URANUS',k:'gas',c:'#8fe0e6',r:.15,dd:7.35,az:-160,el:-4,km:2.72e9,Rk:25362,atm:1,cat:'S',bands:['#8fe0e6','#7fd2da','#a0eef2'],info:'Ice giant tipped on its side.'}),
BO({id:'neptune',n:'NEPTUNE',k:'gas',c:'#4c6fe0',r:.15,dd:8.4,az:95,el:7,km:4.35e9,Rk:24622,atm:1,cat:'S',bands:['#4c6fe0','#3f5fc7','#6584ee'],info:'Windiest world known.'}),
BO({id:'sun',n:'SUN',k:'star',c:'#ffe08a',glow:'#ff9a30',r:.25,dd:3.5,az:200,el:3,km:1.496e8,Rk:695700,cat:'X'}),
BO({id:'proxima',n:'PROXIMA CENTAURI',k:'star',c:'#ff8a6a',glow:'#ff3b1d',r:.6,dd:26,az:35,el:10,km:4.02e13,Rk:107000,cat:'D',info:'Nearest star. Red dwarf, 4.24 ly.'}),
BO({id:'sirius',n:'SIRIUS',k:'star',c:'#dcebff',glow:'#6fa8ff',r:.8,dd:28,az:-75,el:-12,km:8.14e13,Rk:1190000,cat:'D',info:'Brightest star in our sky, 8.6 ly.'}),
BO({id:'sgra',n:'SAGITTARIUS A*',k:'bh',c:'#ffb36b',r:1,dd:32,az:150,el:4,km:2.52e17,Rk:12e6,cat:'D',info:'Milky Way’s black hole, 26,700 ly.'}),
BO({id:'voyager',n:'VOYAGER 1',k:'probe',c:'#e8c76a',r:.015,dd:9.5,az:60,el:0,km:VKM,Rk:.002,cat:'V',info:'Humanity’s farthest probe, launched 1977.'})];
const byId=id=>BODIES.find(b=>b.id===id),SUN=byId('sun');
// ---------- canvas ----------
const cv=$('#cv'),x=cv.getContext('2d');let W,H,F;
const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);F=Math.max(W,H*1.3)*.62};
addEventListener('resize',size);size();
const SK=Array.from({length:520},()=>{const a=rnd()*6.283,e=Math.asin(rnd()*2-1);return{d:dir(a,e),b:rnd(),r:rnd()*1.3+.3}});
const NEB=[[dir(1,.2),'rgba(120,60,200,.14)'],[dir(3.3,-.3),'rgba(40,120,220,.12)'],[dir(5,.4),'rgba(220,80,120,.09)']];
// ---------- state ----------
let M='menu',S,T,K,view=0,mcat='S',cab=0,keys={},fl=0,shake=0,tk=0,ev,G,joy=[0,0];
const VN=['COCKPIT','THIRD PERSON','FRONT (2nd PERSON)'],SN=['PILOT SEAT','ENGINEERING BAY','AIRLOCK'];
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000)};
const alrt=(t,info)=>{const e=$('#al');e.textContent=t;e.className='on'+(info?' i':'');clearTimeout(alrt.t);alrt.t=setTimeout(()=>e.className='',4800)};
const modal=(h,fn)=>{const m=$('#md');m.innerHTML='<div class="mb">'+h+'</div>';m.classList.add('on');for(const k in fn)$('#'+k).onclick=()=>{m.classList.remove('on');fn[k]()}};
// ---------- menu ----------
const mt=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function menu(){M='menu';$('#menu').style.display='flex';['#tel','#cab','#top','#sbar'].forEach(s=>$(s).style.display='none');
const cats=[['S','Solar System'],['D','Deep Space'],['V','Voyager 1']];
$('#menu').innerHTML=`<h1>ORION FLIGHT SIM</h1><p>Pilot a starship in cockpit view, walk the cabin and work real controls, survive hazards, spacewalk, land and drive a rover. A simulation: distances are compressed so trips take minutes.</p>
<div class="tabs">${cats.map(c=>`<button data-c="${c[0]}" class="${mcat===c[0]?'on':''}">${c[1]}</button>`).join('')}</div>
<div class="cards">${BODIES.filter(b=>b.cat===mcat).map(b=>{const dd=b.dd||0,ti=dd/VMAX,real=b.id==='earth'?'You are here':b.id==='voyager'?'≈ '+fd(b.km)+' away now':fd(b.km)+' away';
return `<div class="card"><h3>${b.n}</h3><p>${real}</p><p>${b.info||''}</p><p>${dd?'Trip: '+mt(ti)+' on impulse · '+mt(ti/WARP)+' with warp':'No travel time'}</p><p>${b.land?'🥾 Surface walk + rover':'🧑‍🚀 Spacewalk only'}</p><button data-g="${b.id}">LAUNCH ▶</button></div>`}).join('')}</div>
<p style="font-size:12px">Keys: ←↑↓→ steer · W/S throttle · SPACE warp · V view · N autopilot · C radiators · H shields · G spacewalk · L land. Voyager 1’s distance is estimated live from NASA’s one-light-day milestone (18 Nov 2026).</p>`;
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{mcat=b.dataset.c;menu()});document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>start(b.dataset.g))}
function ui(){const f=M==='fly';$('#menu').style.display='none';$('#tel').style.display='';$('#top').style.display='flex';$('#cab').style.display=f?'':'none';$('#sbar').style.display=f?'none':'flex'}
function top(){$('#top').innerHTML=`<button id="tv">👁 ${VN[view]}</button><button id="tm">☰ MENU</button>`;$('#tv').onclick=cycView;$('#tm').onclick=()=>{if(confirm('Leave the flight and return to the menu?'))menu()}}
// ---------- start ----------
function start(id){T=byId(id);S={p:[0,0,0],yaw:0,pit:0,thr:0,thrT:0,warp:0,ap:0,desc:0,T:12,core:0,hull:100,fuel:100,kits:3,cool:0,shield:0,sT:0,eT:0,b0:0,acc:0,ft:rnd()*20+30,fl:0,at:rnd()*10+18,ast:[],arr:0,lock:0,rep:0,spd:0};
const v=sub(T.p,S.p);S.d0=len(v)||1;S.yaw=Math.atan2(v[0],v[2]);S.pit=Math.asin(v[1]/S.d0);view=0;cab=0;cabShow();G=null;ev=null;M='fly';ui();top();sync();
toast(T.id==='earth'?'You are in Earth orbit. Spacewalk or land when ready.':'Ship ready. Raise throttle, or press N for autopilot.');$('#thr').value=0}
// ---------- flight model ----------
function hit(n,why){S.hull-=n*(S.shield?.3:1);shake=.5;alrt('⚠ '+why+(S.shield?' (shields absorbed most)':''));if(S.hull<=0){S.hull=0;M='dead';modal(`<h2>💥 Ship lost</h2><p>${why}</p><p style="color:#9cb0ca">Pilots survive by watching temperature, warp heat and asteroid warnings.</p><button id="a1">Retry</button><button id="a2">Menu</button>`,{a1:()=>start(T.id),a2:menu})}}
function basis(yaw,pit){return{f:dir(yaw,pit),r:[Math.cos(yaw),0,-Math.sin(yaw)],u:[-Math.sin(yaw)*Math.sin(pit),Math.cos(pit),-Math.cos(yaw)*Math.sin(pit)]}}
const wrap=a=>{while(a>PI)a-=2*PI;while(a<-PI)a+=2*PI;return a};
function toggleWarp(){if(S.warp){S.warp=0;return sync()}if(S.lock)return toast('Warp core locked out: cooling down.');if(S.fuel<=0||S.thr<.05)return toast('Raise throttle first (and keep fuel).');S.warp=1;sync()}
function step(dt){const s=S,b=basis(s.yaw,s.pit),tv=sub(T.p,s.p),d=len(tv),kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ky=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);
if(keys.w)s.thrT=cl(s.thrT+dt*.5);if(keys.s)s.thrT=cl(s.thrT-dt*.5);
const aim=(v,rate)=>{const dd=len(v)||1,ty=Math.atan2(v[0],v[2]),tp=Math.asin(v[1]/dd);s.yaw+=cl(wrap(ty-s.yaw),-rate*dt,rate*dt);s.pit+=cl(tp-s.pit,-rate*dt,rate*dt)};
if(s.desc){aim(tv,1.5);s.thrT=.1;if(s.warp)toggleWarp()}
else if(s.ap){aim(tv,1.3);s.thrT=cl((d-T.r*3)/(T.r*10+.3),.05,1)*(d<T.r*4?0:1);if(d<T.r*4){s.ap=0;sync()}}
else{s.yaw+=cl(kx+joy[0],-1,1)*dt*.9;s.pit=cl(s.pit+cl(ky-joy[1],-1,1)*dt*.9,-1.45,1.45)}
s.thr+=cl(s.thrT-s.thr,-dt*.5,dt*.5);
for(const o of BODIES){if(s.warp&&len(sub(s.p,o.p))<o.r*12+.4){toggleWarp();alrt('Warp dropped: massive body ahead',1)}}
let spd=s.thr*VMAX*(s.warp?WARP:1);if(s.fuel<=0)spd=Math.min(spd,.15*VMAX);s.spd=spd;s.p=add(s.p,b.f,spd*dt);
s.fuel=Math.max(0,s.fuel-dt*(s.thr*(s.warp?.45:.24)+(s.shield?.05:0)));if(s.fuel<=0&&s.thrT>0&&!s.warn){s.warn=1;alrt('Fuel empty: reserve thrusters only')}
const beta=s.warp?0:s.thr*.8,gam=1/Math.sqrt(1-beta*beta);s.sT+=dt;s.eT+=dt*gam;s.acc=s.acc*.9+((beta-s.b0)/dt*CK)*.1;s.b0=beta;s.gam=gam;s.beta=beta;
const ds=len(sub(s.p,SUN.p));let g=14*Math.pow(.5/Math.max(ds-SUN.r,.05),2);

function sync(){if(!S)return;const t=(id,on)=>$(id).classList.toggle('on',!!on);t('#apb',S.ap);t('#clb',S.cool);t('#shb',S.shield);t('#wsw',S.warp);$('#wsw').textContent=S.warp?'WARP ON':'WARP OFF';$('#thr').value=Math.round(S.thrT*100);$('#vwb').textContent='VIEW: '+VN[view].split(' ')[0];if(view>=0&&$('#tv'))$('#tv').textContent='👁 '+VN[view]}

const joyEl=$('#joy');let jd=0;const jm=e=>{const r=joyEl.getBoundingClientRect(),a=cl((e.clientX-r.left-r.width/2)/(r.width/2),-1,1),b=cl((e.clientY-r.top-r.height/2)/(r.height/2),-1,1);joy=[a,b];$('#knob').style.transform=`translate(${a*28}px,${b*28}px)`};
joyEl.onpointerdown=e=>{jd=1;joyEl.setPointerCapture(e.pointerId);jm(e)};joyEl.onpointermove=e=>{if(jd)jm(e)};joyEl.onpointerup=joyEl.onpointercancel=()=>{jd=0;joy=[0,0];$('#knob').style.transform=''};

addEventListener('keydown',e=>{if(M==='menu')return;const k=e.key.length>1?e.key:e.key.toLowerCase();keys[k]=1;if(k.startsWith('Arrow')||k===' ')e.preventDefault();
if(M==='fly'){if(k===' ')$('#wsw').click();else if(k==='v')cycView();else if(k==='n')$('#apb').click();else if(k==='c')$('#clb').click();else if(k==='h')$('#shb').click();else if(k==='g')eva();else if(k==='l')$('#lnb').click()}
else if(M==='eva'&&k==='g')$('#rt').click();else if(M==='surf'){if(k==='r')deploy();else if(k==='e')swap()}});
addEventListener('keyup',e=>{delete keys[e.key.length>1?e.key:e.key.toLowerCase()]});

let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1e3,.05);last=now;shake=Math.max(0,shake-dt);fl=Math.max(0,fl-dt*2);
if(M==='fly'){step(dt);if(M==='fly')world(now)}else if(M==='eva'){S.sT+=dt;S.eT+=dt;world(now)}else if(M==='surf')surf(dt,now);
else if(M==='dead')world(now);else{x.fillStyle='#02030a';x.fillRect(0,0,W,H)}
